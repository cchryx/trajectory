# Render Blueprint: creates the API and the website from this repo.
# In Render: New > Blueprint > pick this repo. Then fill in the secret values it asks for.
services:
  - type: web
    name: trajectory-api
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r api/requirements.txt &&
      python -c "from trajectory.embed import warm; warm()"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false # paste the Supabase Session pooler string
      - key: WEB_ORIGIN
        sync: false # the website's address, e.g. https://trajectory-web.onrender.com

  - type: web
    name: trajectory-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false # the API's address, e.g. https://trajectory-api.onrender.com
