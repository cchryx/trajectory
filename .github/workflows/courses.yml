name: Course refresh

# Course calendars change about once a term, so this runs on the 1st of each month.
# Run it by hand from the Actions tab after you add subjects.
on:
    schedule:
        - cron: "41 9 1 * *"
    workflow_dispatch:
        inputs:
            subjects:
                description: "Subject codes, comma-separated"
                default: "CSC,MAT,STA"

jobs:
    load:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: loaders/requirements.txt

            - run: pip install -r loaders/requirements.txt

            - uses: actions/cache@v4
              with:
                  path: models
                  key: fastembed-bge-small-en-v1.5

            - name: Load UofT courses
              run: python -m loaders.load_courses --school uoft --subjects "${{ inputs.subjects || 'CSC,MAT,STA' }}"
