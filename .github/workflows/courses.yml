name: Course refresh

# Course calendars change about once a term, so this runs on the 1st of each month.
# It loads every course from every UofT calendar: St. George (Arts & Science, Engineering),
# Mississauga and Scarborough. At 1 request per second this takes about 6 minutes.
on:
    schedule:
        - cron: "41 9 1 * *"
    workflow_dispatch:
        inputs:
            faculty:
                description: "Faculty ids, comma-separated, or all"
                default: "all"
            subjects:
                description: "Subject codes like CSC,PHY,CHM, or all"
                default: "all"

jobs:
    load:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: loaders/requirements.txt

            - run: pip install -r loaders/requirements.txt

            - uses: actions/cache@v4
              with:
                  path: models
                  key: fastembed-bge-small-en-v1.5

            - name: Load UofT courses
              run: python -m loaders.load_courses --faculty "${{ inputs.faculty || 'all' }}" --subjects "${{ inputs.subjects || 'all' }}"
