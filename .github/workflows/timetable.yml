name: Timetable refresh

# Loads UofT terms (Fall, Winter, full year) and section times from the Timetable Builder.
# Sections change often in summer and early fall, so this runs every Monday.
# If UofT changes their site, the loader stops, keeps the old data and fails this run.
# GitHub then emails you. See "When UofT changes their website" in the README.
on:
    schedule:
        - cron: "17 8 * * 1"
    workflow_dispatch:
        inputs:
            division:
                description: "ARTSC, APSC, ERIN, SCAR, comma-separated, or all"
                default: "all"
            min_ratio:
                description: "Refuse to save if a division drops below this share of last run (0 turns the check off)"
                default: "0.5"

jobs:
    load:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: loaders/requirements.txt

            - run: pip install -r loaders/requirements.txt

            - name: Load UofT timetable
              run: python -m loaders.load_timetable --division "${{ inputs.division || 'all' }}" --min-ratio "${{ inputs.min_ratio || '0.5' }}"
