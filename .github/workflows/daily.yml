name: Daily job refresh

on:
    schedule:
        - cron: "23 10 * * *" # every day, 6:23 am Toronto time (EDT)
    workflow_dispatch:

jobs:
    load:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: loaders/requirements.txt

            - run: pip install -r loaders/requirements.txt

            # Keep the embedding model between runs so it downloads once.
            - uses: actions/cache@v4
              with:
                  path: models
                  key: fastembed-bge-small-en-v1.5

            - name: Load internship postings
              run: python -m loaders.load_postings

            - name: Fetch job descriptions
              run: python -m loaders.load_descriptions

            - name: Tag skills
              run: python -m loaders.tag_skills

            - name: Embed postings
              run: python -m loaders.embed_postings
